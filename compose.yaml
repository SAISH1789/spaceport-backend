services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: spaceport
      POSTGRES_PASSWORD: spaceport
      POSTGRES_DB: spaceport
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceport -d spaceport"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://spaceport:spaceport@db:5432/spaceport
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
