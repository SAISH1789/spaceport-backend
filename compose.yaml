name: spaceport-backend
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: spaceport
      POSTGRES_PASSWORD: spaceport
      POSTGRES_DB: spaceport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceport -d spaceport"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://spaceport:spaceport@db:5432/spaceport
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 12
    networks:
      default:
      spaceport:
        aliases: [spaceport-api]
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  spaceport:
    name: spaceport-network
